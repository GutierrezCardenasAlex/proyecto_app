map $http_authorization $api_client {
    default $http_authorization;
    '' $binary_remote_addr;
}

# Shared across workers and gateway replicas. The global budget also bounds
# traffic with rotated/unverified Authorization headers.
limit_req_zone $api_client zone=api_client:10m rate=20r/s;
limit_req_zone $server_name zone=api_total:1m rate=300r/s;
limit_conn_zone $server_name zone=api_connections:1m;

upstream gateway_pool {
    zone gateway_pool 64k;
    least_conn;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server gateway-api:3000 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name gateway-edge;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_req_status 429;
    limit_conn_status 429;
    error_page 429 = @overloaded;

    location @overloaded {
        default_type application/json;
        add_header Retry-After 5 always;
        return 429 '{"message":"Demasiadas solicitudes. Intenta nuevamente en unos segundos."}';
    }

    location / {
        limit_req zone=api_client burst=40 nodelay;
        limit_req zone=api_total burst=100 nodelay;
        limit_conn api_connections 256;
        proxy_pass http://gateway_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        # Never enable non_idempotent retries: POSTs may create trips/payments.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
    }
}
